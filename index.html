<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barja's menu</title>
    <link rel="stylesheet" href="./Css/styles.css">

</head>

<body>

    <header>
        <h1>Barja's menu <br>Snacks & BEBIDAS</h1>
        <h3>FRAPPES, BEBIDAS Y MAS</h3>
    </header>

    <section id="Principal" class="active">

        <div id="leche">Frappes de leche</div>
        <div class="cardsL" id="gridL"></div>

        <div id="agua">Frappes de agua</div>
        <div class="cardsA" id="gridA"></div>

        <div id="Bebidas">Bebidas</div>
        <div class="cardsB" id="gridB"></div>

        <div id="Snacks">Snacks</div>
        <div class="cardsS" id="gridS"></div>

        <div class="flotante" onclick="abrirCarrito()"> 
        🛒
        <span id="contador" class="contador"></span>
        </div>

    </section>

    <section id="DetalleP">

        <div class="Detalle">
        <button class="detalle-back" onclick="goBack()">← Regresar</button>
        <div class="detalle-hero"></div>
        <img class="detalleImg" id="Detalle-img">
        <div class="detalleName" id="Detalle-name"></div>
        <div class="detallePrice" id="Detalle-price"></div>
        </div>

        <div class="detalle-body">
        <p class="detalle-info" id="d-desc"></p>
        <p class="detalle-subtext"></p>
        <p class="detalle-subtext"></p>
        <div id="extras"></div>
        <label class="detalle-textarea-label">Instrucciones Especiales:</label>
        <div class="detalle-hint">Escribe aquí tus instrucciones...</div>
        <textarea class="detalle-textarea" id="d-notes" placeholder="Ejemplo: Sin Miguelito"></textarea>
        <button  class="add-btn" onclick="guardarCarrito()">Agregar al pedido</button>
        </div>

    </section>

    <section id="Carrito">
        <button class="detalle-back" onclick="regresarAlPrincipal()">← Regresar</button>
        <div id="contenidoC" class="contenidoC">

        </div>
        <button id="irCarrito" onclick="abrirCompra()">Proceder al pago</button>   
    </section>

    <section id="Compra">
        <div id="datosP"><input type="text" id="nombre" placeholder="Ingrese su nombre"></div>
        <input type="radio" name="pago" id="efectivo" value="Efectivo" > <label for="efectivo">Efectivo</label>
        <input type="radio" name="pago" id="transferenciaInput" value="transferencia"> <label for="transferenciaInput">Transferencia</label>
        <div id="cambioBox" style="display: none;">
        <input type="number" id="pagaCon" placeholder="¿Con cuánto pagas? (ej: 200)">
        </div>
        <div id="transferencia"></div>
        <div id="confirmacion"></div>
        <button id="confirmarP" onclick="enviarW()">Confirmar Pedido</button>
        <button class="detalle-back" onclick="goBack()">← Regresar</button>
    </section>

    <script src="./Js/main.js"></script>
</body>
</html>
